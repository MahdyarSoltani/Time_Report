<style>
:root{color-scheme:dark;--page:#03060a;--edge:rgba(255,255,255,.16);--errbg:rgba(179,38,30,.22);--errbd:rgba(255,138,128,.45);--hover:rgba(255,255,255,.1);--arrow:#6f8791;--xl:#7f95a0;--nil:#5f757d;--track:rgba(255,255,255,.14);--cbg:rgba(176,142,255,.17);--cfg:#d4c4ff;--cbd:rgba(176,142,255,.42);--btnbg:rgba(255,255,255,.1);--btnbd:rgba(255,255,255,.2);--stripe:rgba(255,255,255,.035);--pgs:0 4px 22px rgba(0,0,0,.7);--solid:rgba(24,34,42,.95);--ink:#e7f0f2;--muted:#9fb3bb;--grid:rgba(255,255,255,.14);--acc:#4fd1c5;--accd:#9be9e1;--accbg:rgba(79,209,197,.15);--accbd:rgba(79,209,197,.35);--err:#ffb4ab;
--f1:rgba(255,255,255,.07);--f2:rgba(255,255,255,.05);
--pastel:radial-gradient(circle at 90% 4%,rgba(255,150,120,0.300) 0%,rgba(255,150,120,0.186) 12%,rgba(255,150,120,0.102) 26%,rgba(255,150,120,0.045) 42%,rgba(255,150,120,0.015) 60%,rgba(255,150,120,0) 78%),radial-gradient(circle at 2% 28%,rgba(240,210,90,0.200) 0%,rgba(240,210,90,0.124) 12%,rgba(240,210,90,0.068) 26%,rgba(240,210,90,0.030) 42%,rgba(240,210,90,0.010) 60%,rgba(240,210,90,0) 78%),radial-gradient(circle at 94% 62%,rgba(120,135,255,0.300) 0%,rgba(120,135,255,0.186) 12%,rgba(120,135,255,0.102) 26%,rgba(120,135,255,0.045) 42%,rgba(120,135,255,0.015) 60%,rgba(120,135,255,0) 78%),radial-gradient(circle at 6% 92%,rgba(70,205,215,0.280) 0%,rgba(70,205,215,0.174) 12%,rgba(70,205,215,0.095) 26%,rgba(70,205,215,0.042) 42%,rgba(70,205,215,0.014) 60%,rgba(70,205,215,0) 78%),radial-gradient(circle at 62% 98%,rgba(255,110,170,0.240) 0%,rgba(255,110,170,0.149) 12%,rgba(255,110,170,0.082) 26%,rgba(255,110,170,0.036) 42%,rgba(255,110,170,0.012) 60%,rgba(255,110,170,0) 78%),linear-gradient(#03060a,#03060a);
--gs:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14);--bs:0 2px 14px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02)}
:root[data-theme="light"]{color-scheme:light;--page:#f3f8f8;--edge:rgba(255,255,255,.85);--ink:#1f3340;--muted:#627985;--grid:#cfe3e6;--acc:#1b8a87;--accd:#126a68;--accbg:#d9f3f0;--accbd:#bfe6e2;--err:#b3261e;--errbg:rgba(253,236,234,.92);--errbd:#f1b8b2;--f1:rgba(255,255,255,.55);--f2:rgba(255,255,255,.62);--hover:rgba(255,255,255,.85);--arrow:#8aa0a8;--xl:#6f858e;--nil:#a9bcc2;--track:#d9ebee;--cbg:rgba(124,92,214,.12);--cfg:#5a3fb5;--cbd:rgba(124,92,214,.35);--btnbg:rgba(255,255,255,.7);--btnbd:rgba(255,255,255,.95);--stripe:rgba(20,70,80,.045);--pgs:0 4px 22px rgba(90,120,130,.22);--solid:rgba(255,255,255,.92);--gs:0 10px 36px rgba(90,120,130,.16),inset 0 1px 0 rgba(255,255,255,.9);--bs:0 4px 14px rgba(90,120,130,.12);--pastel:radial-gradient(circle at 90% 4%,rgba(255,170,140,0.950) 0%,rgba(255,170,140,0.589) 12%,rgba(255,170,140,0.323) 26%,rgba(255,170,140,0.142) 42%,rgba(255,170,140,0.048) 60%,rgba(255,170,140,0) 78%),radial-gradient(circle at 2% 28%,rgba(255,236,140,0.900) 0%,rgba(255,236,140,0.558) 12%,rgba(255,236,140,0.306) 26%,rgba(255,236,140,0.135) 42%,rgba(255,236,140,0.045) 60%,rgba(255,236,140,0) 78%),radial-gradient(circle at 94% 62%,rgba(170,182,255,0.950) 0%,rgba(170,182,255,0.589) 12%,rgba(170,182,255,0.323) 26%,rgba(170,182,255,0.142) 42%,rgba(170,182,255,0.048) 60%,rgba(170,182,255,0) 78%),radial-gradient(circle at 6% 92%,rgba(150,232,236,0.950) 0%,rgba(150,232,236,0.589) 12%,rgba(150,232,236,0.323) 26%,rgba(150,232,236,0.142) 42%,rgba(150,232,236,0.048) 60%,rgba(150,232,236,0) 78%),radial-gradient(circle at 62% 98%,rgba(255,172,205,0.850) 0%,rgba(255,172,205,0.527) 12%,rgba(255,172,205,0.289) 26%,rgba(255,172,205,0.128) 42%,rgba(255,172,205,0.043) 60%,rgba(255,172,205,0) 78%),linear-gradient(160deg,#fff9f1,#f1f8ff 55%,#f6fff4)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px;line-height:1.7;min-height:100vh;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #4fd1c5;outline-offset:2px}
.hidden{display:none!important}
.bg{position:fixed;inset:0;z-index:-1;background:var(--pastel)}
.glass{background:var(--f1);border:1px solid var(--edge);box-shadow:var(--gs);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}

.up{min-height:100vh;display:grid;place-items:center;padding:18px}
.up-box{width:100%;max-width:440px;text-align:center;border-radius:36px;padding:32px 20px 24px}
.up h1{font-size:24px;margin:0 0 6px}
.up p{margin:0 0 22px;color:var(--muted)}
.drop{display:block;background:var(--f2);border:2px dashed rgba(79,209,197,.5);border-radius:26px;padding:38px 16px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--hover)}
.drop b{display:block;font-size:17px}
.drop span{color:var(--muted);font-size:13px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:3px solid #4fd1c5;outline-offset:2px}
.err{margin-top:14px;padding:11px 14px;background:var(--errbg);border:1px solid var(--errbd);color:var(--err);border-radius:18px;text-align:right}
.note{margin-top:16px;font-size:12.5px;color:var(--muted)}

.tt{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:20;width:66px;height:36px;padding:3px;border-radius:999px;display:flex;direction:ltr;cursor:pointer;color:var(--muted)}
.tt::before{content:"";position:absolute;top:2px;left:2px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2a9d98,#126a68);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .25s}
:root[data-theme="dark"] .tt::before{transform:translateX(30px)}
.tt svg{position:relative;width:30px;height:30px;padding:6px;flex:none;transition:color .25s}
:root[data-theme="light"] .tt .sun,:root[data-theme="dark"] .tt .moon{color:#fff}
.wrap{max-width:480px;margin:0 auto;padding:52px 12px 190px}
.fname{font-size:12px;color:var(--muted);direction:ltr;text-align:right;padding:0 8px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{border-radius:32px;padding:16px 14px}
.rh h1{font-size:18px;margin:0;line-height:1.5}
.rh p{margin:0;color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 2px}
.card{background:var(--f1);border:1px solid var(--grid);border-radius:16px;padding:6px 11px;box-shadow:var(--bs)}
.card.w2{grid-column:span 2}
.card.hi{background:linear-gradient(135deg,#1fa39c,#0f6f6b);border-color:#2bb8b0;color:#fff}
.card small{display:block;font-size:11px;color:var(--muted);line-height:1.6}
.card strong{display:block;font-size:14.5px;font-weight:700;line-height:1.5}
.card em{display:inline;font-style:normal;font-size:11px;color:var(--muted);margin-right:6px}
.card.hi small,.card.hi em{color:#d6f2ef}
section{margin-top:16px}
section h3{font-size:14.5px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
section h3::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}
section h3 small{color:var(--muted);font-weight:400}
.list{display:grid;gap:6px}
.u{display:grid;gap:5px}
.dh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--accd);padding:4px 4px 0;font-weight:500;white-space:nowrap}
.dh::after{content:"";flex:1;height:1px;background:var(--grid)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;vertical-align:1px}
.rl{background:var(--f1);border:1px solid var(--grid);border-radius:16px;padding:6px 11px;box-shadow:var(--bs)}
.rl-m{display:flex;align-items:center;gap:7px}
.rl-n{flex:1;min-width:0;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.rl-t{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.rl-t i{font-style:normal;color:var(--arrow)}
.rl-t small{font-size:10px;color:var(--accd)}
.rl-x{margin-top:3px;padding-top:3px;border-top:1px dashed var(--grid);font-size:11.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.xl{color:var(--xl)}
.rc{background:var(--f1);border:1px solid var(--grid);border-radius:22px;padding:11px 12px;box-shadow:var(--bs);break-inside:avoid}
.rc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc-h b{font-size:15px}
.rc-d{background:var(--accbg);color:var(--accd);border:1px solid var(--accbd);border-radius:999px;padding:0 10px;font-size:11.5px;font-weight:500;white-space:nowrap}
.rc-g{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.f{background:var(--f2);border:1px solid var(--grid);border-radius:14px;padding:6px 10px;min-width:0}
.f-txt,.f-tags,.f-pct,.f-name,.f-dur{grid-column:1/-1}
.f small{display:block;font-size:10.5px;color:var(--muted);line-height:1.5}
.f>div{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.t{font-weight:500}
.d{font-size:11px;color:var(--muted);line-height:1.5}
.nil{color:var(--nil)}
.chip{display:inline-block;background:var(--cbg);color:var(--cfg);border:1px solid var(--cbd);border-radius:999px;padding:0 9px;margin:0 0 2px 4px;font-size:11.5px;line-height:1.7}
.pb{display:inline-block;vertical-align:middle;width:70px;height:7px;border-radius:4px;background:var(--track);margin-left:8px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--acc);float:right}

.dock{position:fixed;z-index:5;right:12px;left:12px;max-width:456px;margin:0 auto;bottom:max(12px,env(safe-area-inset-bottom));border-radius:30px;padding:10px}
.dock-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.ghost{grid-column:1/-1;padding:8px 16px;background:transparent;border-color:transparent;color:var(--muted)}
.btn{border:1px solid var(--btnbd);background:var(--btnbg);color:var(--ink);padding:11px 16px;border-radius:999px;white-space:nowrap}
.btn.pri{background:linear-gradient(135deg,#1fa39c,#0f6f6b);border-color:#2bb8b0;color:#fff;font-weight:500}
.btn:disabled{opacity:.65;cursor:progress}
.stat{font-size:12.5px;color:var(--muted);padding:0 8px 7px;text-align:center}
.stat:empty{display:none}
.stat.bad{color:var(--err)}

#stage{position:fixed;left:-10000px;top:0}
#printRoot{display:none}
.pdf-page{position:relative;background:var(--pastel);display:flex;flex-direction:column;padding:16px;direction:rtl;color:var(--ink);overflow:hidden;font-family:Vazirmatn,Tahoma,sans-serif;font-size:11px;line-height:1.65;margin-bottom:20px}
.pg-glass{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:26px;padding:14px 13px 8px;background:var(--f1);border:1.5px solid var(--edge);box-shadow:var(--pgs)}
.pdf-page .pg-body{flex:1;min-height:0;overflow:hidden;margin:0 -14px;padding:2px 14px 14px}
.pdf-page .pg-head{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);border-bottom:1px solid var(--grid);padding-bottom:5px;margin-bottom:6px}
.pdf-page.first .pg-head{display:none}
.pdf-page .pg-foot{padding-top:4px;font-size:9px;color:var(--muted);text-align:left}
.pdf-page .rh h1{font-size:15px}
.pdf-page .rh p{font-size:10px}
.pdf-page .cards{gap:6px;margin:8px 0 2px}
.pdf-page .card{border-radius:13px;padding:4px 9px}
.pdf-page .card small{font-size:9px}
.pdf-page .card strong{font-size:11.5px}
.pdf-page .card em{font-size:8.5px}
.pdf-page section{margin-top:12px}
.pdf-page section h3{font-size:12px;margin-bottom:6px}
.pdf-page .list{gap:5px}
.pdf-page .u{gap:4px}
.pdf-page .dh{font-size:9.5px;padding-top:3px}
.pdf-page .rl{border-radius:13px;padding:4px 9px}
.pdf-page .rl-m{gap:6px}
.pdf-page .rl-n{font-size:11px}
.pdf-page .rl-t{font-size:9.5px}
.pdf-page .rl-t small{font-size:8.5px}
.pdf-page .rl-x{font-size:9.5px}
.pdf-page .rc{border-radius:16px;padding:7px 9px}
.pdf-page .rc-h b{font-size:12px}
.pdf-page .rc-d{font-size:9.5px;padding:0 8px}
.pdf-page .rc-g{gap:5px;margin-top:6px}
.pdf-page .f{border-radius:11px;padding:3px 8px}
.pdf-page .f small{font-size:8.5px}
.pdf-page .f>div{font-size:10.5px;line-height:1.55}
.pdf-page .d{font-size:9px}
.pdf-page .chip{font-size:9px;padding:0 7px;margin-bottom:1px}
.pdf-page .pb{width:56px;height:6px}

@media print{
  html,body{background:var(--page)!important;min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  #printRoot .pdf-page{margin:0;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printRoot .pdf-page:last-child{break-after:auto;page-break-after:auto}
}
.tw{border:1px solid var(--grid);border-radius:18px;overflow:hidden;background:var(--f2)}
.rt{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
.rt th{background:var(--accbg);color:var(--accd);font-weight:500;padding:7px 11px;text-align:right;white-space:nowrap;border-left:1px solid var(--grid);border-bottom:1px solid var(--grid)}
.rt td{padding:6px 11px;border-bottom:1px solid var(--grid);border-left:1px solid var(--grid);vertical-align:top;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.rt tbody tr:nth-child(even) td{background:var(--stripe)}
.rt th:last-child,.rt td:last-child{border-left:0}
.rt tbody tr:last-child td{border-bottom:0}
.c-name{font-weight:700}
.c-dur,.c-dt,.c-pct{white-space:nowrap!important}
.pdf-page.wide{padding:18px}
.pdf-page.wide .pg-glass{padding:18px 24px 8px;border-radius:30px}
.pdf-page.wide .rh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pdf-page.wide .rh h1{font-size:19px}
.pdf-page.wide .rh p{font-size:11.5px}
.pdf-page.wide .cards{grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 2px}
.pdf-page.wide .card.w2{grid-column:span 1}
.pdf-page.wide .card{padding:5px 12px}
.pdf-page.wide .card small{font-size:10px}
.pdf-page.wide .card strong{font-size:13px}
.pdf-page.wide .pg-head{font-size:10.5px}
.pdf-page.wide section{margin-top:14px}
.pdf-page.wide section h3{font-size:13px}
.pdf-page.wide .d{font-size:9.5px}
.pdf-page.wide .chip{font-size:10px}
@media (min-width:600px){.wrap{padding-top:26px}}
@media (prefers-reduced-transparency:reduce){.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--solid)}}
</style>

<div class="bg" aria-hidden="true"></div>

  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<main id="upload" class="up">
  <div class="up-box glass">
    <h1>گزارش روزانه به PDF</h1>
    <p>فایل CSV برنامهٔ A Time Logger Pro را انتخاب کنید تا گزارشی منظم برای مشاور تحصیلی ساخته شود.</p>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".csv,text/csv">
      <b>انتخاب فایل CSV</b>

    </label>

  </div>
</main>

  </div>

      <button class="btn pri" id="dl" type="button" onclick="alert('در صفحه‌ای که باز می‌شود، روی گزینه Paper size کلیک کنید و A5 یا A4 را انتخاب کنید تا خروجی تمام صفحه ذخیره شود.')">PDF موبایل</button>
      <button class="btn pri" id="dlw" type="button">PDF کامپیوتر (۱۶:۹)</button>

    </div>
  </div>
</div>

<script>
/* ============ توابع خالص (پردازش داده) ============ */
const FA = '۰۱۲۳۴۵۶۷۸۹';
const fa = s => String(s).replace(/\d/g, d => FA[d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');

// برچسب ستون‌ها بر اساس نام‌های واقعی فایل
const HL = {'Activity type':'فعالیت', 'Duration':'مدت‌زمان', 'From':'شروع', 'To':'پایان', 'Comment':'توضیحات', 'Tags':'برچسب‌ها', '%':'درصد از کل'};
const kindOf = h => ({'activity type':'name', duration:'dur', from:'dt', to:'dt', tags:'tags', '%':'pct', comment:'txt'}[h.trim().toLowerCase()] || 'txt');

// تحلیل CSV (RFC 4180): نقل‌قول، کاما و خط جدید داخل نقل‌قول، سلول خالی، CRLF، BOM
function parseCSV(t) {
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === '') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; }
    else f += c;
  }
  if (q) throw new Error('نقل‌قول (") در فایل بسته نشده است.');
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  return rows;
}

// فایل خروجی برنامه چند جدول پشت‌سرهم دارد که با یک خط خالی جدا شده‌اند
function toBlocks(rows) {
  const blocks = []; let cur = [];
  for (const r of rows) {
    if (r.every(c => c.trim() === '')) { if (cur.length) blocks.push(cur); cur = []; }
    else cur.push(r);
  }
  if (cur.length) blocks.push(cur);
  return blocks.filter(b => b.length >= 2 && b[0].length >= 2).map(b => {
    const n = Math.max(...b.map(r => r.length));
    const headers = b[0].map(h => h.trim());
    while (headers.length < n) headers.push('');
    return {headers, rows: b.slice(1).map(r => Array.from({length: n}, (_, i) => r[i] ?? ''))};
  });
}

const parseDur = s => { const m = /^\s*(\d+)\s*h\s*(\d+)\s*m\s*$/i.exec(s); return m ? +m[1] * 60 + +m[2] : null; };
const fmtDur = min => { const h = Math.floor(min / 60), m = min % 60; return h && m ? `${fa(h)} ساعت و ${fa(m)} دقیقه` : h ? `${fa(h)} ساعت` : `${fa(m)} دقیقه`; };
function parseDT(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{1,2}):(\d{2}) (AM|PM)$/i.exec(s.trim());
  if (!m) return null;
  let h = +m[4] % 12; if (m[6].toUpperCase() === 'PM') h += 12;
  return {y:+m[1], mo:+m[2], d:+m[3], key:`${m[1]}${m[2]}${m[3]}${pad(h)}${m[5]}`,
          time:`${fa(pad(m[4]))}:${fa(m[5])} ${m[6].toUpperCase() === 'AM' ? 'ق.ظ' : 'ب.ظ'}`};
}
const jf = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {day:'numeric', month:'long', year:'numeric', timeZone:'UTC'});
const jal = o => jf.format(new Date(Date.UTC(o.y, o.mo - 1, o.d, 12)));
const greg = o => `${o.y}/${pad(o.mo)}/${pad(o.d)}`;
const rangeOf = (a, b, f) => (f(a) === f(b) ? f(a) : `${f(a)} تا ${f(b)}`);

function buildModel(text, fileName) {
  const blocks = toBlocks(parseCSV(text));
  if (!blocks.length) throw new Error('جدولی با سرستون و حداقل یک ردیف داده در فایل پیدا نشد.');
  blocks.forEach((b, i) => {
    const h = b.headers.map(x => x.toLowerCase());
    b.title = i === 0 ? 'گزارش تفصیلی فعالیت‌ها' : h.includes('%') ? 'خلاصهٔ مدت‌زمان به تفکیک نوع فعالیت' : `جدول ${fa(i + 1)}`;
  });
  const m = {blocks, cards: [], range: '', rangeG: '', fileBase: 'time-report'};
  const d = blocks.find(b => ['activity type', 'duration', 'from', 'to'].every(k => b.headers.some(h => h.toLowerCase() === k)));
  if (d) {
    const ix = k => d.headers.findIndex(h => h.toLowerCase() === k);
    const [iA, iD, iF, iT] = ['activity type', 'duration', 'from', 'to'].map(ix);
    const durs = d.rows.map(r => parseDur(r[iD]));
    const froms = d.rows.map(r => parseDT(r[iF])), tos = d.rows.map(r => parseDT(r[iT]));
    const ok = durs.every(x => x !== null);
    const total = ok ? durs.reduce((a, b) => a + b, 0) : null;
    const all = [...froms, ...tos].filter(Boolean).sort((a, b) => a.key.localeCompare(b.key));
    const days = new Set(froms.filter(Boolean).map(x => `${x.y}-${x.mo}-${x.d}`));
    if (all.length) {
      const a = all[0], b = all[all.length - 1];
      m.range = rangeOf(a, b, jal); m.rangeG = rangeOf(a, b, greg);
      m.fileBase = `time-report_${a.y}-${pad(a.mo)}-${pad(a.d)}` + (greg(a) === greg(b) ? '' : `_to_${b.y}-${pad(b.mo)}-${pad(b.d)}`);
      m.cards.push({l:'بازهٔ گزارش', v:m.range, s:m.rangeG, w2:true});
    }
    m.cards.push({l:'تعداد فعالیت‌ها', v:fa(d.rows.length)});
    if (ok) m.cards.push({l:'مجموع زمان ثبت‌شده', v:fmtDur(total), hi:true});
    if (days.size) m.cards.push({l:'روزهای دارای ثبت', v:fa(days.size)});
    if (ok && total >= 0) { const mx = Math.max(...durs), i = durs.indexOf(mx); m.cards.push({l:'طولانی‌ترین ثبت', v:fmtDur(mx), s:d.rows[i][iA].trim()}); }
  }
  return m;
}

function cell(h, raw) {
  const v = String(raw).trim(), k = kindOf(h);
  if (!v) return '<span class="nil">—</span>';
  if (k === 'dur') { const n = parseDur(v); return n === null ? esc(v) : fmtDur(n); }
  if (k === 'dt') { const o = parseDT(v); return o ? `<div class="t">${o.time}</div><div class="d">${jal(o)} · <bdi dir="ltr">${fa(greg(o))}</bdi></div>` : esc(v); }
  if (k === 'tags') return v.split(',').map(t => t.trim()).filter(Boolean).map(t => `<span class="chip">${esc(t)}</span>`).join('') || '<span class="nil">—</span>';
  if (k === 'pct') { const n = parseFloat(v); return isNaN(n) ? esc(v) : `<span class="pb"><i style="width:${Math.min(100, n)}%"></i></span>${fa(v.replace('.', '٫'))}٪`; }
  return esc(v);
}
/* ============ تولید HTML (کارت‌های موبایل + جدول ۱۶:۹) ============ */
const DOTS = ['#ff9e80', '#ffd54f', '#8c9eff', '#4dd0e1', '#f48fb1', '#a5d6a7', '#ce93d8', '#ffcc80'];
const dot = n => `<i class="dot" style="background:${DOTS[[...String(n).trim()].reduce((a, c) => a + c.charCodeAt(0), 0) % DOTS.length]}"></i>`;
const thHTML = b => b.headers.map(h => `<th class="c-${kindOf(h)}">${esc(HL[h] || h)}</th>`).join('');
const trHTML = (b, r) => `<tr>${b.headers.map((h, i) => `<td class="c-${kindOf(h)}">${kindOf(h) === 'name' ? dot(r[i]) : ''}${cell(h, r[i])}</td>`).join('')}</tr>`;
const tableSec = (b, rows, cont) => `<section><h3>${esc(b.title)}${cont ? ' <small>(ادامه)</small>' : ''}</h3><div class="tw"><table class="rt"><thead><tr>${thHTML(b)}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
function cardHTML(b, r) {
  const ks = b.headers.map(kindOf);
  let ti = ks.indexOf('name'); if (ti < 0) ti = 0;
  const di = ks.indexOf('dur');
  const fields = b.headers.map((h, i) => (i === ti || i === di) ? '' :
    `<div class="f f-${ks[i]}"><small>${esc(HL[h] || h)}</small><div>${cell(h, r[i])}</div></div>`).join('');
  const dur = di >= 0 && di !== ti ? `<span class="rc-d">${cell(b.headers[di], r[di])}</span>` : '';
  return `<article class="rc"><div class="rc-h"><b>${ks[ti] === 'name' ? dot(r[ti]) : ''}${cell(b.headers[ti], r[ti])}</b>${dur}</div>${fields ? `<div class="rc-g">${fields}</div>` : ''}</article>`;
}
const headHTML = m => `<div class="rh"><h1>گزارش فعالیت‌ها</h1><p>${m.range ? `${esc(m.range)} (${esc(m.rangeG)})` : esc(m.fileName)}</p></div>`;
const ORDER = ['مجموع زمان ثبت‌شده', 'تعداد فعالیت‌ها', 'روزهای دارای ثبت', 'طولانی‌ترین ثبت'];
const cardsHTML = m => {
  const cs = m.cards.filter(c => ORDER.includes(c.l)).sort((a, b) => ORDER.indexOf(a.l) - ORDER.indexOf(b.l));
  return cs.length ? `<div class="cards">${cs.map(c => `<div class="card${c.hi || c.s ? ' w2' : ''}${c.hi ? ' hi' : ''}"><small>${esc(c.l)}${c.s ? ` <em>${esc(c.s)}</em>` : ''}</small><strong>${esc(c.v)}</strong></div>`).join('')}</div>` : '';
};
/* ردیف تک‌خطی برای جدول ریز فعالیت‌ها */
const jShort = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {day: 'numeric', month: 'short', timeZone: 'UTC'});
const isLog = b => ['activity type', 'duration', 'from', 'to'].every(k => b.headers.some(h => h.toLowerCase() === k));
const colIx = (b, k) => b.headers.findIndex(h => h.toLowerCase() === k);
const dayOf = (b, i) => { const o = i >= 0 && parseDT(b.rows[i][colIx(b, 'from')] || ''); return o ? `${o.y}-${o.mo}-${o.d}` : ''; };
function lineHTML(b, r) {
  const [iA, iD, iF, iT] = ['activity type', 'duration', 'from', 'to'].map(k => colIx(b, k));
  const f = parseDT(r[iF] || ''), t = parseDT(r[iT] || '');
  const s = f ? f.time : esc(r[iF].trim());
  const e = t ? t.time + (f && (t.y !== f.y || t.mo !== f.mo || t.d !== f.d) ? ` <small>${jShort.format(new Date(Date.UTC(t.y, t.mo - 1, t.d, 12)))}</small>` : '') : esc(r[iT].trim());
  const extra = b.headers.map((h, i) => (i === iA || i === iD || i === iF || i === iT || !r[i].trim()) ? '' :
    (kindOf(h) === 'tags' ? cell(h, r[i]) : `<span class="xl">${esc(HL[h] || h)}:</span> ${cell(h, r[i])}`)).filter(Boolean).join(' ');
  return `<article class="rl"><div class="rl-m"><b class="rl-n">${dot(r[iA])}${cell(b.headers[iA], r[iA])}</b><span class="rc-d">${cell(b.headers[iD], r[iD])}</span><span class="rl-t"><span>${s}</span><i>←</i><span>${e}</span></span></div>${extra ? `<div class="rl-x">${extra}</div>` : ''}</article>`;
}
function unitHTML(b, i, force) {
  if (!isLog(b)) return cardHTML(b, b.rows[i]);
  const k = dayOf(b, i), o = parseDT(b.rows[i][colIx(b, 'from')] || '');
  const head = o && (force || i === 0 || k !== dayOf(b, i - 1)) ? `<div class="dh">${jal(o)} · <bdi dir="ltr">${fa(greg(o))}</bdi></div>` : '';
  return `<div class="u">${head}${lineHTML(b, b.rows[i])}</div>`;
}
// فایل برنامه از آخر به اول است؛ گزارش تفصیلی را از اولین فعالیت تا آخرین نمایش می‌دهیم
function chrono(m) {
  const b = m.blocks.find(isLog); if (!b || b.rows.length < 2) return;
  const i = colIx(b, 'from'), k = r => (parseDT(r[i] || '') || {key: ''}).key;
  if (k(b.rows[0]) > k(b.rows[b.rows.length - 1])) b.rows.reverse();
}
const secHTML = (b, rows, cont) => `<section><h3>${esc(b.title)}${cont ? ' <small>(ادامه)</small>' : ''}</h3><div class="list">${rows}</div></section>`;

/* ============ رابط کاربری ============ */
const $ = id => document.getElementById(id);
let model = null, oldTitle = '';

function showErr(msg) { const e = $('uerr'); e.textContent = msg; e.classList.remove('hidden'); }
function setStat(t, bad) { const s = $('stat'); s.textContent = t; s.classList.toggle('bad', !!bad); }
function reset() { model = null; $('viewer').classList.add('hidden'); $('upload').classList.remove('hidden'); $('uerr').classList.add('hidden'); $('file').value = ''; setStat(''); }

async function handleFile(f) {
  $('uerr').classList.add('hidden');
  if (!f) return;
  if (!/\.csv$/i.test(f.name) && !/csv|text\/plain/.test(f.type)) return showErr('فقط فایل با پسوند CSV پذیرفته می‌شود.');
  if (f.size > 10 * 1024 * 1024) return showErr('حجم فایل بیش از ۱۰ مگابایت است.');
  try {
    const text = new TextDecoder('utf-8', {fatal: true}).decode(await f.arrayBuffer());
    model = buildModel(text, f.name); model.fileName = f.name; chrono(model);
  } catch (e) {
    return showErr(e instanceof TypeError ? 'رمزگذاری فایل UTF-8 نیست؛ فایل را دوباره از برنامه خروجی بگیرید.' : `فایل نامعتبر است: ${e.message}`);
  }
  $('report').innerHTML = headHTML(model) + cardsHTML(model) + model.blocks.map(b => secHTML(b, b.rows.map((r, i) => unitHTML(b, i)).join(''))).join('');
  $('fname').textContent = f.name; setStat('');
  $('upload').classList.add('hidden'); $('viewer').classList.remove('hidden'); window.scrollTo(0, 0);
}

const drop = $('drop');
$('file').addEventListener('change', e => handleFile(e.target.files[0]));
['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
$('again').addEventListener('click', reset);

/* ============ PDF متنی: صفحه‌بندی با نسبت ۹:۱۹٫۵ موبایل + چاپ مرورگر (متن واقعی، شکل‌دهی درست فارسی) ============ */
const MODES = {mobile: {W: 378, H: 819, size: '378px 820px', tag: 'mobile'}, wide: {W: 1123, H: 631, size: '1123px 632px', tag: '16x9'}};
function paginate(m, mode) {
  const {W, H} = MODES[mode], wide = mode === 'wide';
  const stage = $('stage'); stage.innerHTML = ''; const pages = [];
  const addPage = first => {
    const p = document.createElement('div'); p.className = 'pdf-page' + (wide ? ' wide' : '') + (first ? ' first' : '');
    p.style.cssText = `width:${W}px;height:${H}px`;
    p.innerHTML = `<div class="pg-glass"><div class="pg-head"><b>گزارش فعالیت‌ها</b><span>${esc(m.range)}</span></div><div class="pg-body"></div><div class="pg-foot"></div></div>`;
    stage.append(p); pages.push(p); return p.querySelector('.pg-body');
  };
  let body = addPage(true); body.innerHTML = headHTML(m) + cardsHTML(m);
  const over = () => body.scrollHeight > body.clientHeight + 1;
  for (const [bi, b] of m.blocks.entries()) {
    if (bi > 0) body = addPage(false);   // هر جدولِ بعد از جدول اول (خلاصه) همیشه در صفحهٔ جدید
    let cont = false, list;
    const open = () => { body.insertAdjacentHTML('beforeend', wide ? tableSec(b, '', cont) : secHTML(b, '', cont)); list = body.lastElementChild.querySelector(wide ? 'tbody' : '.list'); };
    const unit = (ri, force) => wide ? trHTML(b, b.rows[ri]) : unitHTML(b, ri, force);
    open();
    for (const ri of b.rows.keys()) {
      list.insertAdjacentHTML('beforeend', unit(ri, false));
      const el = list.lastElementChild;
      if (!over()) continue;
      el.remove();
      const had = list.children.length > 0;
      if (!had && body.children.length === 1) { list.append(el); continue; }   // ردیف بلندتر از یک صفحه
      if (!had) body.lastElementChild.remove();
      body = addPage(false); cont = had; open(); list.insertAdjacentHTML('beforeend', unit(ri, true));
    }
  }
  pages.forEach((p, i) => p.querySelector('.pg-foot').textContent = `صفحهٔ ${fa(i + 1)} از ${fa(pages.length)}`);
  return pages;
}

async function savePDF(mode) {
  if (!model) return;
  const btns = [$('dl'), $('dlw')]; btns.forEach(b => b.disabled = true); setStat('در حال آماده‌سازی…');
  try {
    if (document.fonts) { await Promise.all(['400', '500', '700'].map(w => document.fonts.load(`${w} 14px Vazirmatn`))).catch(() => {}); await document.fonts.ready; }
    const pages = paginate(model, mode);
    $('pgsz').textContent = `@page{size:${MODES[mode].size};margin:0}`;
    $('printRoot').replaceChildren(...pages);
    oldTitle = document.title; document.title = `${model.fileBase}_${MODES[mode].tag}`;   // نام پیش‌فرض فایل PDF
    setStat('در پنجرهٔ چاپ گزینهٔ «ذخیره به‌صورت PDF» را بزنید.');
    await new Promise(r => setTimeout(r, 200));
    window.print();
  } catch (e) {
    console.error(e); setStat('آماده‌سازی PDF با خطا مواجه شد. دوباره تلاش کنید.', true);
  } finally { btns.forEach(b => b.disabled = false); }
}
$('dl').addEventListener('click', () => savePDF('mobile'));
$('dlw').addEventListener('click', () => savePDF('wide'));
window.addEventListener('afterprint', () => { $('printRoot').replaceChildren(); $('stage').innerHTML = ''; if (oldTitle) document.title = oldTitle; });
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#03060a' : '#f3f8f8';
  $('tt').setAttribute('aria-label', t === 'dark' ? 'تغییر به تم روشن' : 'تغییر به تم تیره');
}
$('tt').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
setTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
</script>
